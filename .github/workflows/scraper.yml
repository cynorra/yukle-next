name: Scraper Cron Job

on:
  # Paused 2026-08-23: stopping new scraped-listing ingestion while we get
  # AdSense re-approved and address the marketplace thin/duplicate-content
  # ratio flagged in prior SEO review. Re-enable the schedule block below
  # once loads should resume flowing in.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TR/EU Scraper (nakliyerehberim.com)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
        run: node scripts/scraper.js --all

      - name: Run US/Canada Scraper (FreightFinder.com)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
        run: node scripts/freightfinder-serverless.js
