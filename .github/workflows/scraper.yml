name: Scraper Cron Job

on:
  # Re-enabled 2026-09-04: marketplace listings are no longer part of the
  # website's public/indexed surface at all (dropped 2026-08-29, see the
  # noindex comments in scripts/scraper.js) - the thin/duplicate-content SEO
  # risk this was paused for doesn't apply to a page nothing links to or
  # indexes. Loads now feed the native Android app (FCM push per country via
  # /api/webhooks/fcm-batch) instead of the website's own listings.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TR/EU Scraper (nakliyerehberim.com)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
          SCRAPER_WEBHOOK_SECRET: ${{ secrets.SCRAPER_WEBHOOK_SECRET }}
        run: node scripts/scraper.js --all

      - name: Run US/Canada Scraper (FreightFinder.com)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
          SCRAPER_WEBHOOK_SECRET: ${{ secrets.SCRAPER_WEBHOOK_SECRET }}
        run: node scripts/freightfinder-serverless.js
