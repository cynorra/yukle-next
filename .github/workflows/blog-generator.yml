name: Blog Generator Cron Job

on:
  schedule:
    # Gunde 1 kez, tek makale x 47 dil. Onceki */5 dakika x 3 makale temposu
    # (gunde 288 tetikleme, teorik tavanda 864 makale/gun) editoryal degil,
    # otomatik icerik ureten bir "content mill" gibi goruluyordu -- hem organik
    # siralama hem AdSense'in "scaled content abuse" / "low value content"
    # tespitleri icin risk. Bu tempo, kucuk bir editoryal ekibin gercekci
    # cikti hizini yansitiyor.
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: blog-generator
  cancel-in-progress: false

jobs:
  run-blog-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Blog Generator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
          ARTICLES_PER_RUN: '1'
        run: node scripts/blog-generator.js
