name: Blog Generator Cron Job

on:
  # The weekday schedule (cron 0 9 * * 1-5) was DISABLED 2026-10-11: the blog now consists of
  # hand-sourced guides (see content-rewrites/). An unattended generator publishing into the same
  # table would recreate the scaled-content pattern behind the AdSense low-value rejection.
  # Re-enable only with the owner's say-so.
  workflow_dispatch: # manual trigger only

concurrency:
  group: blog-generator
  cancel-in-progress: false

jobs:
  run-blog-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The quality gates are the only thing standing between the model and the live site. If a refactor ever breaks
      # one, fail here (before anything is generated or published) instead of finding out from an AdSense review.
      - name: Quality gate self-test
        run: npm run blog:test

      # universal-adsense-site-standard.md 2.2: publishing at the exact same
      # second every single weekday is a pattern a human editorial process
      # never produces. This is a real random delay (not a spoofed
      # published-at timestamp) so the article's actual created_at lands
      # somewhere in a believable morning window instead of always 09:00:0X
      # UTC on the nose.
      - name: Randomized human-like publish delay
        run: sleep $(( RANDOM % 7200 ))

      - name: Run Blog Generator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_WORKERS_AI_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_WORKERS_AI_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ARTICLES_PER_RUN: '1'
        run: node scripts/blog-generator.js

      # After publishing, audit the WHOLE archive with the same gates. Blocking categories (first-person claims, hype,
      # YMYL topics, repeated fabricated figures, numeric titles...) turn this run red, so a regression is seen the day it
      # happens. Warnings (year framing, decimal precision) do not fail the run.
      - name: Audit published archive
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-blog.js

