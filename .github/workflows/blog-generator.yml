name: Blog Generator Cron Job

on:
  schedule:
    # Her 5 dakikada bir, scraper'lardan bagimsiz calisir (Gunde 288 tetikleme)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: blog-generator
  cancel-in-progress: false

jobs:
  run-blog-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Blog Generator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_SHIPPER_ID: ${{ secrets.SCRAPER_SHIPPER_ID }}
          ARTICLES_PER_RUN: '3'
        run: node scripts/blog-generator.js
