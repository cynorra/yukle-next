name: Backfill Broken Blog Cover Images

on:
  workflow_dispatch: # Manual trigger only — one-off cleanup job, not a recurring cron

concurrency:
  group: backfill-blog-images
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    # 350 min (GitHub's hard cap for hosted runners is 360) — at the safe
    # 20s/group Pexels pace that's ~1050 groups per run; a large backlog of
    # image groups needs this workflow re-triggered more than once.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/backfill-blog-images.js
